<meta name="description" content="Plan de estudio semanal según tus créditos, temporizador contra la procrastinación y reels de estudio. Funciona sin internet.">
<meta name="theme-color" content="#E4572E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#160E19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="fl0" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B7A6B0"/><stop offset="1" stop-color="#DCCFD6"/></linearGradient>
  <linearGradient id="fl1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF4F1F"/><stop offset="1" stop-color="#FFC23D"/></linearGradient>
  <linearGradient id="fl2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#D92B3A"/><stop offset="1" stop-color="#FF8A1F"/></linearGradient>
  <linearGradient id="fl3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B8186E"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient>
  <linearGradient id="fl4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5B3FD6"/><stop offset="1" stop-color="#E24ED8"/></linearGradient>
  <linearGradient id="gSun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset=".55" stop-color="#E23D6A"/><stop offset="1" stop-color="#8E2A86"/></linearGradient>
</defs></svg>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Cuaderno de Foco</div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
      <button class="tab" role="tab" data-tab="horario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h3M8 17h6"/></svg>Horario</button>
      <button class="tab" role="tab" data-tab="enfoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Enfoque</button>
      <button class="tab" role="tab" data-tab="reels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Reels</button>
    </nav>
    <button class="schip" id="schip" title="Tu racha">0</button>
    <button class="btn sm primary" id="install-btn" hidden>Instalar</button>
    <button class="sync" id="sync" data-s="ok" title="Tus datos y copias de seguridad"><span>Guardado en este dispositivo</span></button>
  </div>
</header>

<main id="main">
  <section class="view" id="v-hoy" data-view="hoy"></section>
  <section class="view" id="v-horario" data-view="horario" hidden></section>
  <section class="view" id="v-enfoque" data-view="enfoque" hidden></section>
  <section class="view" id="v-reels" data-view="reels" hidden></section>
</main>
<div id="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<noscript><p style="padding:16px">Cuaderno de Foco necesita JavaScript activado.</p></noscript>

<script src="js/reels-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
